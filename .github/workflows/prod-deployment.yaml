name: '[prod] Deploy qubetics evm tx decoder'

on: 
  push:
    branches: 
      - master

jobs:
  deploy_qubetics_indexer:
    uses: ./.github/workflows/qubetics-evm-tx-decoder.yaml
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Indexer/qubetics-indexer-deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-evm-tx-decoder
      DOCKER_USERNAME: ap-southeast-1@HPUAJWWFSLCMD312AZSR
      ENV: ${{ vars.PROD_QUBETICS_EVM_TX_DECODER_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_NEW }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
