name: '[testnet] Deploy evm tx decoder'

on: 
  push:
    branches: 
      - testnet

jobs:
  deploy_evm_tx_decoder:
    uses: ./.github/workflows/testnet-evm-tx-decoder.yml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Evm-tx-decoder/tx-decoder-deployment.yaml
      HUAWEI_IMAGE: testnet-evm-tx-decoder
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.TEST_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
